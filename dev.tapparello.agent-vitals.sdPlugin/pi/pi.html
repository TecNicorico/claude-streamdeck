<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { background: #2d2d2d; color: #d8d8d8; font-family: -apple-system, "Segoe UI", system-ui, sans-serif; font-size: 13px; margin: 0; padding: 10px; }
  .item { margin-bottom: 10px; }
  label { display: block; margin-bottom: 4px; color: #969696; }
  input[type=text], input[type=password], textarea, select { width: 100%; box-sizing: border-box; background: #3d3d3d; border: 1px solid #555; color: #eee; border-radius: 4px; padding: 6px; font-size: 13px; }
  input[type=number] { width: 100%; box-sizing: border-box; background: #3d3d3d; border: 1px solid #555; color: #eee; border-radius: 4px; padding: 6px; font-size: 13px; }
  .rateshead { color: #969696; margin: 12px 0 4px; font-weight: 600; }
  .raterow { display: grid; grid-template-columns: 64px 1fr 1fr; gap: 6px; align-items: center; margin-bottom: 6px; }
  .raterow span { color: #969696; }
  .cap { color: #7a7a7a; font-size: 11px; margin-top: 8px; }
  textarea { height: 70px; resize: vertical; }
  .chk { display: flex; align-items: center; gap: 6px; color: #d8d8d8; }
</style>
</head>
<body>
<div id="form"></div>
<script>
let ws, piUuid, settings = {}, action = "", models = [], gs = {}, gsReady = false;
const RATE_DEFAULTS = { opus: [5, 25], sonnet: [2, 10], haiku: [1, 5], fable: [10, 50] };
const BUDGET_FIELD = { key: "budget", type: "number", label: "Budget $ for this window (optional - turns the key into a % ring)" };
// Le letture su Supabase approvate da sole (cloud/deck-hook.mjs, letturaAutomatica).
const LETTURE_FIELD = { key: "_letture", type: "letture", label: "Approva da solo le letture su Supabase (SELECT e strumenti che leggono): chiede solo per le scritture" };
const INSTALL_FIELD = { key: "_install", type: "install", label: "One-time setup - merge into the \"hooks\" object of ~/.claude/settings.json, then restart Claude Code" };
// I consumi freschi dal terminale (src/consumi.js): la barra di stato di Claude Code li
// manda al plugin a ogni risposta.
const STATUSLINE_FIELD = { key: "_statusline", type: "statusline", label: "Consumi aggiornati dal terminale - incolla in ~/.claude/settings.json, al primo livello, poi riapri Claude Code" };
// La sonda dei consumi (src/sonda.js): globale, accesa se non è spenta qui.
const SONDA_FIELD = { key: "_sonda", type: "sonda", label: "Senza un terminale aperto, chiedi i consumi a Claude Code ogni 10 minuti (una richiesta minima a Haiku, mentre questa pagina è a schermo)" };
// Un tasto che mostra e basta può fare da tasto della riga in basso mentre c'è una
// richiesta in attesa, e tornare com'era dopo (vedi slotDi in src/view.js).
const SLOT_FIELD = { key: "slot", type: "select", label: "Con una richiesta in attesa diventa", default: "", options: [
  { value: "", label: "Resta com'è" },
  { value: "approve-deny", label: "Deny / opzione a sinistra" },
  { value: "approve-always", label: "Info / opzione centrale" },
  { value: "approve-allow", label: "Allow / opzione a destra" },
] };
const FIELDS = {
  "dev.tapparello.agent-vitals.usage-session": [BUDGET_FIELD, SLOT_FIELD, SONDA_FIELD, STATUSLINE_FIELD],
  "dev.tapparello.agent-vitals.usage-weekly": [BUDGET_FIELD, SLOT_FIELD, SONDA_FIELD, STATUSLINE_FIELD],
  "dev.tapparello.agent-vitals.usage-model": [
    { key: "model", type: "modelselect", label: "Model to display" },
    BUDGET_FIELD,
    SLOT_FIELD,
    SONDA_FIELD,
    STATUSLINE_FIELD,
  ],
  "dev.tapparello.agent-vitals.burn-rate": [SLOT_FIELD],
  "dev.tapparello.agent-vitals.today": [SLOT_FIELD],
  "dev.tapparello.agent-vitals.sessions": [SLOT_FIELD],
  "dev.tapparello.agent-vitals.project": [
    { key: "label", type: "text", label: "Button label" },
    { key: "path", type: "text", label: "Project folder (full path)" },
  ],
  "dev.tapparello.agent-vitals.quick-prompt": [
    { key: "label", type: "text", label: "Button label" },
    { key: "prompt", type: "textarea", label: "Prompt (pasted into quick chat — overwrites clipboard)" },
    { key: "hotkey", type: "text", label: "Quick-chat hotkey (macOS only, e.g. option+space)" },
    { key: "enter", type: "checkbox", label: "Press Enter automatically" },
  ],
  "dev.tapparello.agent-vitals.quick-chat": [
    { key: "hotkey", type: "text", label: "Quick-chat hotkey (macOS only, e.g. option+space)" },
  ],
  "dev.tapparello.agent-vitals.custom": [
    { key: "label", type: "text", label: "Button label" },
    { key: "command", type: "text", label: "Open (app path, URL, or folder)" },
  ],
  "dev.tapparello.agent-vitals.usage-meter": [
    { key: "window", type: "select", label: "Time window", default: "today", options: [
      { value: "today", label: "Today" },
      { value: "month", label: "Month-to-date" },
      { value: "7day", label: "7-day" },
    ] },
    { key: "label", type: "text", label: "Button label (optional)" },
    SLOT_FIELD,
  ],
  "dev.tapparello.agent-vitals.approver-status": [
    { key: "label", type: "text", label: "Button label (optional)" },
    { key: "project", type: "text", label: "Project to track (folder name, blank = auto)" },
    { key: "cycle", type: "checkbox", label: "Press cycles through sessions (off = this key keeps its own slot)" },
  ],
  "dev.tapparello.agent-vitals.approve-allow": [
    { key: "label", type: "text", label: "Button label (optional)" },
    LETTURE_FIELD,
    INSTALL_FIELD,
  ],
  "dev.tapparello.agent-vitals.approve-always": [
    INSTALL_FIELD,
  ],
  "dev.tapparello.agent-vitals.approve-deny": [
    { key: "label", type: "text", label: "Button label (optional)" },
    INSTALL_FIELD,
  ],
  // La terza pagina (fork TecNicorico).
  "dev.tapparello.agent-vitals.posta": [
    { key: "email", type: "text", label: "Indirizzo Gmail o Google Workspace" },
    { key: "_password", type: "postaPassword", label: "Password per le app di questo indirizzo" },
    { key: "modo", type: "select", label: "Cosa contare", default: "principale", options: [
      { value: "principale", label: "Principale, come Gmail (conversazioni)" },
      { value: "tutta", label: "Tutta la posta in arrivo (messaggi)" },
    ] },
    { key: "label", type: "text", label: "Etichetta (vuoto = la parte prima della @)" },
  ],
  "dev.tapparello.agent-vitals.thecore": [
    { key: "metrica", type: "metrica", label: "Che numero mostra" },
    SLOT_FIELD,
  ],
};
// Lo stesso elenco di METRICHE in src/thecore.js, nello stesso ordine: il pannello
// non importa moduli, e test/thecore.test.js confronta i due.
const METRICHE_PI = [
  ["fatturato", "Vendite", "Fatturato della stagione"],
  ["ordini_oggi", "Vendite", "Ordini di oggi"],
  ["ufficializzate", "Vendite", "Scuole ufficializzate"],
  ["ufficializzate_merch", "Vendite", "Merch ufficializzati"],
  ["ufficializzate_annuari", "Vendite", "Annuari ufficializzati"],
  ["raggiunte", "Directory", "Scuole raggiunte"],
  ["da_assegnare", "Directory", "Scuole senza sales"],
  ["richieste", "Directory", "Richieste dal form da assegnare"],
  ["ris_da_scrutinare", "Hiring", "Candidature da scrutinare"],
  ["candidati_accettati", "Hiring", "Candidati RIS accettati"],
  ["ris_documenti", "Hiring", "Documenti da verificare"],
  ["eletti_senza_documento", "Hiring", "Eletti senza documento"],
  ["ris_eletti", "Hiring", "RIS eletti"],
  ["notifiche", "Operativo", "Le mie notifiche"],
  ["job", "Operativo", "Job dell'outbox"],
  ["plao", "Operativo", "PLAO da controllare"],
  ["fornitori", "Operativo", "Ordini fornitori con un problema"],
];
const normEmail = (e) => { const t = String(e ?? "").trim().toLowerCase(); return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(t) ? t : ""; };
function save() { ws.send(JSON.stringify({ event: "setSettings", context: piUuid, payload: settings })); }
function build() {
  const form = document.getElementById("form");
  form.innerHTML = "";
  for (const f of FIELDS[action] ?? []) {
    const div = document.createElement("div");
    div.className = "item";
    if (f.type === "modelselect") {
      const l = document.createElement("label");
      l.textContent = f.label;
      const s = document.createElement("select");
      const auto = document.createElement("option");
      auto.value = "";
      auto.textContent = models.length ? "Auto (first available)" : "Auto (waiting for usage data…)";
      s.append(auto);
      for (const m of models) {
        const o = document.createElement("option");
        o.value = m;
        o.textContent = m;
        s.append(o);
      }
      s.value = settings[f.key] ?? "";
      if (s.selectedIndex < 0) s.value = "";
      s.onchange = () => { settings[f.key] = s.value; save(); };
      div.append(l, s);
    } else if (f.type === "select") {
      const l = document.createElement("label");
      l.textContent = f.label;
      const sel = document.createElement("select");
      for (const o of f.options) {
        const opt = document.createElement("option");
        opt.value = o.value;
        opt.textContent = o.label;
        sel.append(opt);
      }
      sel.value = settings[f.key] ?? f.default ?? "";
      if (sel.selectedIndex < 0) sel.value = f.default ?? (sel.options[0] ? sel.options[0].value : "");
      sel.onchange = () => { settings[f.key] = sel.value; save(); };
      div.append(l, sel);
    } else if (f.type === "install") {
      const lab = document.createElement("label");
      lab.textContent = f.label;
      const ta = document.createElement("textarea");
      ta.readOnly = true;
      ta.rows = 9;
      ta.id = "installSnippet";
      ta.value = "loading…";
      const btn = document.createElement("button");
      btn.textContent = "Copy";
      btn.onclick = () => { ta.select(); document.execCommand("copy"); btn.textContent = "Copied"; setTimeout(() => (btn.textContent = "Copy"), 1200); };
      const note = document.createElement("div");
      note.id = "installNote";
      note.style.cssText = "font-size:11px;color:#9b96a8;margin-top:4px";
      note.textContent = "A fragment: add it inside the \"hooks\" object, do not replace the file. The URL contains a secret unique to this install - treat it like a password.";
      // A separate element for the hook-server error, so an error never REPLACES the
      // merge instructions / secret warning above - it sits alongside them instead.
      const err = document.createElement("div");
      err.id = "installError";
      err.style.cssText = "font-size:11px;color:#f87171;margin-top:4px;display:none";
      div.append(lab, ta, btn, note, err);
      ws.send(JSON.stringify({ event: "sendToPlugin", action, context: piUuid, payload: { cmd: "getInstall" } }));
    } else if (f.type === "letture") {
      const l = document.createElement("label");
      l.className = "chk";
      const c = document.createElement("input");
      c.type = "checkbox";
      c.id = "lettureCheck";
      c.checked = gs.sqlLettureAuto !== false;
      c.onchange = () => {
        if (!gsReady) { c.checked = gs.sqlLettureAuto !== false; return; }
        if (c.checked) delete gs.sqlLettureAuto; else gs.sqlLettureAuto = false;
        ws.send(JSON.stringify({ event: "setGlobalSettings", context: piUuid, payload: gs }));
      };
      const note = document.createElement("div");
      note.style.cssText = "font-size:11px;color:#9b96a8;margin-top:4px";
      note.textContent = "Vale per le sessioni di questo PC. Per quelle nel cloud decide l'hook del relay: si spegne con DECK_LETTURE_SQL=0 nelle variabili d'ambiente.";
      l.append(c, document.createTextNode(f.label));
      div.append(l, note);
    } else if (f.type === "sonda") {
      const l = document.createElement("label");
      l.className = "chk";
      const c = document.createElement("input");
      c.type = "checkbox";
      c.id = "sondaCheck";
      c.checked = gs.sondaConsumi !== false;
      c.onchange = () => {
        if (!gsReady) { c.checked = gs.sondaConsumi !== false; return; }
        if (c.checked) delete gs.sondaConsumi; else gs.sondaConsumi = false;
        ws.send(JSON.stringify({ event: "setGlobalSettings", context: piUuid, payload: gs }));
      };
      l.append(c, document.createTextNode(f.label));
      div.append(l);
    } else if (f.type === "statusline") {
      const lab = document.createElement("label");
      lab.textContent = f.label;
      const ta = document.createElement("textarea");
      ta.readOnly = true;
      ta.rows = 4;
      ta.id = "statuslineSnippet";
      ta.value = "loading…";
      const btn = document.createElement("button");
      btn.textContent = "Copy";
      btn.onclick = () => { ta.select(); document.execCommand("copy"); btn.textContent = "Copied"; setTimeout(() => (btn.textContent = "Copy"), 1200); };
      const note = document.createElement("div");
      note.style.cssText = "font-size:11px;color:#9b96a8;margin-top:4px";
      note.textContent = "Un pezzo, non il file intero: va accanto a \"hooks\", e sostituisce una statusLine che hai gia'. Funziona mentre c'e' una sessione di Claude Code aperta nel terminale. L'indirizzo contiene il segreto degli hook: trattalo come una password.";
      div.append(lab, ta, btn, note);
      ws.send(JSON.stringify({ event: "sendToPlugin", action, context: piUuid, payload: { cmd: "getInstall" } }));
    } else if (f.type === "postaPassword") {
      // La password NON va nelle impostazioni del tasto (finirebbe in un profilo
      // esportato): va in quelle globali, per indirizzo, e il campo non la rimostra.
      const l = document.createElement("label");
      l.textContent = f.label;
      const i = document.createElement("input");
      i.type = "password"; i.autocomplete = "off"; i.spellcheck = false; i.id = "postaPassword";
      const email = normEmail(settings.email);
      const salvata = !!(email && gs.posta && gs.posta[email] && gs.posta[email].password);
      i.placeholder = !email ? "prima scrivi l'indirizzo" : salvata ? "salvata — incolla per sostituirla" : "16 lettere, da myaccount.google.com/apppasswords";
      i.disabled = !email || !gsReady;
      i.onchange = () => {
        const e = normEmail(settings.email);
        const v = i.value.replace(/\s+/g, "");
        if (!gsReady || !e || !v) return;
        gs.posta = gs.posta ?? {};
        gs.posta[e] = { password: v };
        ws.send(JSON.stringify({ event: "setGlobalSettings", context: piUuid, payload: gs }));
        i.value = "";
        i.placeholder = "salvata — incolla per sostituirla";
        setTimeout(askPosta, 4000);
      };
      div.append(l, i);
      if (salvata) {
        const via = document.createElement("button");
        via.textContent = "Dimentica la password";
        via.onclick = () => {
          delete gs.posta[email];
          ws.send(JSON.stringify({ event: "setGlobalSettings", context: piUuid, payload: gs }));
          build();
        };
        div.append(via);
      }
      const cap = document.createElement("div"); cap.className = "cap";
      cap.textContent = "Serve la verifica in due passaggi sull'account. La password resta su questo PC, nelle impostazioni del plugin, e non finisce in un profilo esportato.";
      const st = document.createElement("div"); st.className = "cap"; st.id = "postaState";
      div.append(cap, st);
    } else if (f.type === "metrica") {
      const l = document.createElement("label");
      l.textContent = f.label;
      const sel = document.createElement("select");
      const gruppi = new Map();
      for (const [id, gruppo, nome] of METRICHE_PI) {
        if (!gruppi.has(gruppo)) { const g = document.createElement("optgroup"); g.label = gruppo; gruppi.set(gruppo, g); sel.append(g); }
        const o = document.createElement("option"); o.value = id; o.textContent = nome;
        gruppi.get(gruppo).append(o);
      }
      const RINOMINATE = { avvisi: "notifiche" }; // come METRICHE_RINOMINATE in src/thecore.js
      sel.value = RINOMINATE[settings[f.key]] ?? settings[f.key] ?? METRICHE_PI[0][0];
      if (sel.selectedIndex < 0) sel.value = METRICHE_PI[0][0];
      sel.onchange = () => { settings[f.key] = sel.value; save(); };
      div.append(l, sel);
    } else if (f.type === "checkbox") {
      const l = document.createElement("label");
      l.className = "chk";
      const c = document.createElement("input");
      c.type = "checkbox";
      c.checked = !!settings[f.key];
      c.onchange = () => { settings[f.key] = c.checked; save(); };
      l.append(c, document.createTextNode(f.label));
      div.append(l);
    } else if (f.type === "number") {
      const l = document.createElement("label");
      l.textContent = f.label;
      const i = document.createElement("input");
      i.type = "number"; i.step = "any"; i.min = "0";
      const cur = settings[f.key];
      i.value = cur == null || cur === "" ? "" : String(cur);
      // onchange, not oninput: for input[type=number] the value reads "" for any
      // intermediate non-numeric state, so typing "12.50" would momentarily
      // clear the setting and flip the key out of ring mode mid-keystroke.
      i.onchange = () => {
        const n = parseFloat(i.value);
        if (Number.isFinite(n) && n > 0) settings[f.key] = n; else delete settings[f.key];
        save();
      };
      div.append(l, i);
    } else {
      const l = document.createElement("label");
      l.textContent = f.label;
      const i = document.createElement(f.type === "textarea" ? "textarea" : "input");
      if (f.type === "text") i.type = "text";
      i.value = settings[f.key] ?? "";
      i.oninput = () => { settings[f.key] = i.value; save(); };
      div.append(l, i);
    }
    form.append(div);
  }
  if (action === "dev.tapparello.agent-vitals.usage-meter") buildRates();
  if (RELAY_ACTIONS.includes(action)) buildRelay();
  if (action === THECORE_ACTION) buildTheCore();
  if (action === POSTA_ACTION) {
    // Cambiato l'indirizzo, il campo della password è di un'altra casella.
    const em = [...document.querySelectorAll("#form input[type=text]")][0];
    if (em) em.onchange = () => { build(); setTimeout(askPosta, 1500); };
    askPosta();
  }
}
const POSTA_ACTION = "dev.tapparello.agent-vitals.posta";
const THECORE_ACTION = "dev.tapparello.agent-vitals.thecore";
const GS_ACTIONS = ["dev.tapparello.agent-vitals.usage-meter", "dev.tapparello.agent-vitals.usage-model", POSTA_ACTION, THECORE_ACTION];
function askPosta() { if (ws && action === POSTA_ACTION) ws.send(JSON.stringify({ event: "sendToPlugin", action, context: piUuid, payload: { cmd: "getPosta" } })); }
function askTheCore() { ws.send(JSON.stringify({ event: "sendToPlugin", action, context: piUuid, payload: { cmd: "getTheCore" } })); }
// TheCore: impostazioni condivise da tutti i tasti TheCore (global settings), come
// quelle del relay. La chiave si genera in TheCore e si vede una volta sola.
const THECORE_FIELDS = [
  { key: "thecoreUrl", label: "Indirizzo della funzione (https://…/functions/v1/deck-metriche)", type: "text" },
  { key: "thecoreKey", label: "Chiave dello Stream Deck (szd_…)", type: "password" },
  { key: "thecoreApp", label: "Indirizzo di TheCore (dove la pressione apre le pagine)", type: "text" },
];
let thecoreInfo = null;
function buildTheCore() {
  let box = document.getElementById("thecore");
  if (!box) { box = document.createElement("div"); box.id = "thecore"; document.getElementById("form").append(box); }
  box.innerHTML = "";
  const h = document.createElement("div"); h.className = "rateshead"; h.textContent = "TheCore — condivise"; box.append(h);
  for (const f of THECORE_FIELDS) {
    const div = document.createElement("div"); div.className = "item";
    const l = document.createElement("label"); l.textContent = f.label;
    const i = document.createElement("input"); i.type = f.type; i.autocomplete = "off"; i.spellcheck = false;
    i.value = gs[f.key] ?? "";
    i.onchange = () => {
      if (!gsReady) return;
      const v = i.value.trim();
      if (v) gs[f.key] = v; else delete gs[f.key];
      ws.send(JSON.stringify({ event: "setGlobalSettings", context: piUuid, payload: gs }));
      setTimeout(askTheCore, 3000);
    };
    div.append(l, i);
    box.append(div);
  }
  const st = document.createElement("div"); st.className = "cap"; st.id = "thecoreState";
  st.textContent = thecoreInfo ?? "";
  box.append(st);
  const cap = document.createElement("div"); cap.className = "cap";
  cap.textContent = "Le tre cose si copiano da TheCore: Impostazioni → Preferenze → Stream Deck → «Genera la chiave». La chiave apre i numeri di tutta la stagione: trattala come una password.";
  box.append(cap);
}
// Relay e Supabase: impostazioni condivise da tutti i tasti (global settings), come le
// tariffe del tasto Usage. La chiave è quella del DECK, mai quella del cloud.
const RELAY_ACTIONS = ["approve-allow", "approve-always", "approve-deny", "approver-status", "approver-waiting", "usage-session", "usage-weekly"].map((k) => "dev.tapparello.agent-vitals." + k);
const RELAY_FIELDS = [
  { key: "relayUrl", label: "Relay per le sessioni cloud (https://…workers.dev)", type: "text" },
  { key: "relayToken", label: "Chiave DECK del relay", type: "password" },
  { key: "supabaseProd", label: "Progetti Supabase di PRODUZIONE (riferimenti, separati da virgole)", type: "text" },
  { key: "supabaseStaging", label: "Progetti Supabase di STAGING", type: "text" },
];
let relayInfo = null;
function buildRelay() {
  let box = document.getElementById("relay");
  if (!box) { box = document.createElement("div"); box.id = "relay"; document.getElementById("form").append(box); }
  box.innerHTML = "";
  const h = document.createElement("div"); h.className = "rateshead"; h.textContent = "Sessioni cloud e Supabase — condivise"; box.append(h);
  for (const f of RELAY_FIELDS) {
    const div = document.createElement("div"); div.className = "item";
    const l = document.createElement("label"); l.textContent = f.label;
    const i = document.createElement("input"); i.type = f.type; i.autocomplete = "off"; i.spellcheck = false;
    i.value = gs[f.key] ?? "";
    i.onchange = () => {
      if (!gsReady) return;
      const v = i.value.trim();
      if (v) gs[f.key] = v; else delete gs[f.key];
      ws.send(JSON.stringify({ event: "setGlobalSettings", context: piUuid, payload: gs }));
      setTimeout(askRelay, 1500);
    };
    div.append(l, i);
    box.append(div);
  }
  const st = document.createElement("div"); st.className = "cap"; st.id = "relayState";
  st.textContent = !relayInfo ? "" : relayInfo.ok ? `Collegato · ${relayInfo.sessioni} sessioni cloud` : relayInfo.err ? `Non collegato: ${relayInfo.err}` : "Relay non configurato: solo le sessioni di questo computer.";
  box.append(st);
  const cap = document.createElement("div"); cap.className = "cap";
  cap.textContent = "Una scrittura su un progetto che non è fra quelli di staging chiede di tenere premuto ALLOW per due secondi.";
  box.append(cap);
}
function askRelay() { ws.send(JSON.stringify({ event: "sendToPlugin", action, context: piUuid, payload: { cmd: "getRelay" } })); }
function buildRates() {
  let box = document.getElementById("rates");
  if (!box) { box = document.createElement("div"); box.id = "rates"; document.getElementById("form").append(box); }
  box.innerHTML = "";
  const h = document.createElement("div"); h.className = "rateshead"; h.textContent = "Cost rates — shared ($/M tokens)"; box.append(h);
  const rates = gs.rates ?? {};
  for (const fam of ["opus", "sonnet", "haiku", "fable"]) {
    const row = document.createElement("div"); row.className = "raterow";
    const label = document.createElement("span"); label.textContent = fam; row.append(label);
    ["in", "out"].forEach((io, idx) => {
      const inp = document.createElement("input");
      inp.type = "number"; inp.step = "any"; inp.min = "0";
      inp.placeholder = String(RATE_DEFAULTS[fam][idx]);
      const cur = rates[fam] ? rates[fam][io] : undefined;
      inp.value = typeof cur === "number" ? String(cur) : "";
      inp.onchange = () => {
        if (!gsReady) return;
        gs.rates = gs.rates ?? {};
        gs.rates[fam] = gs.rates[fam] ?? {};
        const n = parseFloat(inp.value);
        if (Number.isFinite(n) && n >= 0) gs.rates[fam][io] = n; else delete gs.rates[fam][io];
        ws.send(JSON.stringify({ event: "setGlobalSettings", context: piUuid, payload: gs }));
      };
      row.append(inp);
    });
    box.append(row);
  }
  const cap = document.createElement("div"); cap.className = "cap";
  cap.textContent = "Shared across all Usage keys. Blank = default. Cost is still an estimate.";
  box.append(cap);
}
function connectElgatoStreamDeckSocket(port, uuid, evt, info, actionInfo) {
  piUuid = uuid;
  const ai = JSON.parse(actionInfo);
  action = ai.action;
  settings = ai.payload?.settings ?? {};
  ws = new WebSocket("ws://127.0.0.1:" + port);
  ws.onopen = () => {
    ws.send(JSON.stringify({ event: evt, uuid }));
    build();
    if (action === "dev.tapparello.agent-vitals.usage-model") {
      ws.send(JSON.stringify({ event: "sendToPlugin", action, context: piUuid, payload: { cmd: "getModels" } }));
    }
    if (GS_ACTIONS.includes(action) || RELAY_ACTIONS.includes(action)) {
      ws.send(JSON.stringify({ event: "getGlobalSettings", context: piUuid }));
    }
    if (RELAY_ACTIONS.includes(action)) askRelay();
    if (action === THECORE_ACTION) askTheCore();
  };
  ws.onmessage = (e) => {
    let m;
    try { m = JSON.parse(e.data); } catch { return; }
    if (m.event === "didReceiveGlobalSettings") {
      gs = m.payload?.settings ?? {};
      gsReady = true;
      const sc = document.getElementById("sondaCheck");
      if (sc) sc.checked = gs.sondaConsumi !== false;
      const lc = document.getElementById("lettureCheck");
      if (lc) lc.checked = gs.sqlLettureAuto !== false;
      if (action === "dev.tapparello.agent-vitals.usage-meter") buildRates();
      if (RELAY_ACTIONS.includes(action)) buildRelay();
      if (action === POSTA_ACTION) build();
      if (action === THECORE_ACTION) buildTheCore();
      return;
    }
    if (m.event === "sendToPropertyInspector" && typeof m.payload?.posta === "string") {
      const st = document.getElementById("postaState");
      if (st) st.textContent = m.payload.posta;
    }
    if (m.event === "sendToPropertyInspector" && typeof m.payload?.thecore === "string") {
      thecoreInfo = m.payload.thecore;
      const st = document.getElementById("thecoreState");
      if (st) st.textContent = thecoreInfo;
    }
    if (m.event === "sendToPropertyInspector" && m.payload?.relay) {
      relayInfo = m.payload.relay;
      if (RELAY_ACTIONS.includes(action) && gsReady) buildRelay();
    }
    if (m.event === "sendToPropertyInspector" && Array.isArray(m.payload?.models)) {
      models = m.payload.models;
      build();
    }
    if (m.event === "sendToPropertyInspector" && m.payload?.install) {
      const ta = document.getElementById("installSnippet");
      const err = document.getElementById("installError");
      if (ta) ta.value = m.payload.install.snippet;
      const sl = document.getElementById("statuslineSnippet");
      if (sl && m.payload.install.statusline) sl.value = m.payload.install.statusline;
      if (err) {
        // Show the ACTUAL error text - it is not always "port busy" (e.g. EADDRINUSE
        // is, but a bind failure for another reason is not) - and keep it as an
        // addition alongside the merge/secret note, never a replacement for it.
        if (m.payload.install.error) {
          err.textContent = `Hook server problem: ${m.payload.install.error}`;
          err.style.display = "block";
        } else {
          err.textContent = "";
          err.style.display = "none";
        }
      }
    }
  };
}
